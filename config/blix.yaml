# Blix v0.2 configuration
# All keys are optional — env vars (.env) override these,
# and both override the coded defaults.

llm:
  provider: "transformers"                    # "transformers" | "ollama"
  model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  ollama_model: "llama3.2"
  temperature: 0.7
  max_new_tokens: 512

embed:
  model: "all-MiniLM-L6-v2"
  threshold: 0.35
  top_k: 5

memory:
  recent_k: 3
  fuzzy_top_k: 3
  fuzzy_threshold: 60.0
  keyword_top_k: 3
  auto_extract: true

debug: false

# v0.3.16 ADMA settings (ISSUE-014)
# All values are optional — these are the production defaults.
adma:
  learner:
    decay_factor: 0.995
    reward_threshold: 0.5
    snapshot_every: 20
    decay_persist_every: 50
    cache_max_size: 1000
  optimizer:
    min_observations: 10
    aging_threshold: 0.35
    convergence_window: 5
    convergence_tolerance: 0.02
    rollback_drop_threshold: 0.10
    mutation_scale: 0.1
  reward_engine:
    latency_target_ms: 500.0
    retrieval_latency_target_ms: 200.0
    token_budget: 2000
  reward_log:
    max_rows_per_policy: 1000
    stats_last_n: 1000
  prompt_compiler:
    token_budget: 2000
    max_memory_nodes: 5

# v0.3.16 HGSHM settings (ISSUE-014)
hgshm:
  embedding:
    dim: 256
    backend: numpy
  retrieval:
    default_top_k: 10
    max_age_hours: 24.0
    min_score: 0.0
    graph_max_depth: 2
    graph_max_nodes: 50
    weights:
      semantic: 0.25
      vector: 0.20
      graph_distance: 0.10
      importance: 0.15
      confidence: 0.10
      recency: 0.08
      hierarchy: 0.04
      context_similarity: 0.03
      attention: 0.02
      belief_confidence: 0.02
      planning_relevance: 0.01
  consolidation:
    similarity_threshold: 0.92
    jaccard_threshold: 0.70
    prune_below_importance: 0.05
    prune_below_confidence: 0.10
    max_scan: 500
  hierarchy:
    max_summary_length: 300
    min_cluster_size: 3

# Feature flags (ISSUE-014)
features:
  hybrid_retrieval: true
  adaptive_policy: true
  graph_reasoning: true
  hierarchy: true
  semantic_search: true
  reward_learning: true
  prompt_compiler: true
  memory_consolidation: true

# Database filenames (A06) — override to use different names per environment
# e.g. BLIX_DB_HGSHM=hgshm_prod.db or set in blix.yaml [hgshm.database]
