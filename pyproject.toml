[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
# Exclude development-only packages from the installed wheel.
# Without this, auto-discovery installs tests/, experiments/,
# hypothesis/, and learning/ into site-packages.
exclude = [
    "tests",
    "tests.*",
    "experiments",
    "experiments.*",
    "hypothesis",
    "hypothesis.*",
    "learning",
    "learning.*",
]

[project]
name = "blix"
version = "0.3.19.9"
description = "Curiosity + Active Experimentation — CuriosityEngine, HypothesisManager, ExperimentPlanner, KnowledgeGapTracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
eval = [
    "datasets>=2.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.1",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "rouge-score>=0.1.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.2.0",
    "transformers>=4.30.0",
    "sacrebleu>=2.0.0",
]
transformers = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]
ollama = [
    "ollama>=0.2.0",
]
documents = [
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
]
media = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
blix = "blix.app:main"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
